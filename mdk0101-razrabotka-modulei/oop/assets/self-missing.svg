<svg xmlns="http://www.w3.org/2000/svg" width="700" height="308" viewBox="0 0 700 308" role="img" aria-labelledby="title desc"><title id="title">Число аргументов при пропущенном self</title><desc id="desc">Стрелки в строках показывают передаваемые аргументы. До выполнения print внутри borrow программа не доходит.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="700" height="308" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="16" width="676" height="104" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="26" y="44" font-weight="700">Вызов reader.borrow(&quot;Python&quot;)</text><text x="26" y="72">Аргумент 1 → reader (автоматически)</text><text x="26" y="98">Аргумент 2 → &quot;Python&quot; (явно)</text><path d="M350 125 v25" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="162" width="676" height="130" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="26" y="190" font-weight="700">Определение def borrow(title)</text><text x="26" y="218">Предусмотрен один параметр</text><text x="26" y="244">Передано два аргумента</text><text x="26" y="270">Результат вызова: TypeError</text></g></svg>
