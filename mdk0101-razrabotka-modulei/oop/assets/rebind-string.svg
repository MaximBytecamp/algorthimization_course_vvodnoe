h="2"/><path d="M13 206 H127" stroke="#80601f"/><text x="26" y="192" font-weight="700" fill="#80601f">text</text><rect x="180" y="45" width="128" height="85" rx="7" fill="#edf6fb" stroke="#246795" stroke-width="2"/><path d="M181 86 H307" stroke="#246795"/><text x="194" y="72" font-weight="700" fill="#246795">Строка</text><text x="194" y="111">«склад»</text><rect x="180" y="165" width="128" height="106" rx="7" fill="#edf6fb" stroke="#246795" stroke-width="2"/><path d="M181 206 H307" stroke="#246795"/><text x="194" y="192" font-weight="700" fill="#246795">Результат</text><text x="194" y="231">«склад № 2»</text><path d="M138 83 L168 83" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M138 203 L168 203" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/></g></g></svg>