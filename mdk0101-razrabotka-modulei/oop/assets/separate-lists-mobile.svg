<svg xmlns="http://www.w3.org/2000/svg" width="320" height="348" viewBox="0 0 320 348" role="img" aria-labelledby="title desc"><title id="title">Изменение второго из двух независимых списков</title><desc id="desc">first ссылается на список с ручкой. second ссылается на другой список, куда добавлена тетрадь.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#246795"/></marker></defs><rect width="320" height="348" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="12" width="115" height="82" rx="7" fill="#fff3da" stroke="#80601f" stroke-width="2"/><path d="M13 53 H126" stroke="#80601f"/><text x="26" y="39" font-weight="700" fill="#80601f">first</text><path d="M137 54 L169 54" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="182" y="12" width="126" height="110" rx="7" fill="#edf6fb" stroke="#246795" stroke-width="2"/><path d="M183 53 H307" stroke="#246795"/><text x="196" y="39" font-weight="700" fill="#246795">Список A</text><text x="196" y="78">«ручка»</text><rect x="12" y="158" width="115" height="82" rx="7" fill="#fff3da" stroke="#80601f" stroke-width="2"/><path d="M13 199 H126" stroke="#80601f"/><text x="26" y="185" font-weight="700" fill="#80601f">second</text><path d="M137 200 L169 200" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="182" y="158" width="126" height="145" rx="7" fill="#edf6fb" stroke="#246795" stroke-width="2"/><path d="M183 199 H307" stroke="#246795"/><text x="196" y="185" font-weight="700" fill="#246795">Список B</text><text x="196" y="224">«ручка»</text><text x="196" y="249">«тетрадь»</text><text x="12" y="333">first is second → False</text></g></svg>