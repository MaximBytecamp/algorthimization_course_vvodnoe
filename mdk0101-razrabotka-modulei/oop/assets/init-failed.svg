<svg xmlns="http://www.w3.org/2000/svg" width="700" height="454" viewBox="0 0 700 454" role="img" aria-labelledby="title desc"><title id="title">Присваивание при ошибке инициализации</title><desc id="desc">Стрелки между полями показывают ход программы, включая обработку исключения.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="700" height="454" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="16" width="676" height="104" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="26" y="44" font-weight="700">До попытки создания</text><text x="26" y="72">reader → None</text><text x="26" y="98">Аргумент name: &quot;   &quot;</text><path d="M350 125 v25" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="162" width="676" height="130" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="26" y="190" font-weight="700">Внутри __init__</text><text x="26" y="218">После strip(): name → &quot;&quot;</text><text x="26" y="244">raise ValueError(...)</text><text x="26" y="270">Успешного результата вызова нет</text><path d="M350 297 v25" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="334" width="676" height="104" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="26" y="362" font-weight="700">После обработки ошибки</text><text x="26" y="390">reader по-прежнему → None</text><text x="26" y="416">Вывод проверки: True</text></g></svg>
