<svg xmlns="http://www.w3.org/2000/svg" width="300" height="458" viewBox="0 0 300 458" role="img" aria-labelledby="title desc"><title id="title">Почему ответ проверки изменился</title><desc id="desc">Стрелки показывают последовательность программы. Только средний этап изменяет список.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#2D7FC1"/></marker></defs><rect width="300" height="458" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="15" fill="#020835"><rect x="12" y="12" width="276" height="118" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="39" font-weight="700">До добавления</text><text x="24" y="65">0 книг, limit = 1</text><text x="24" y="88">has_room() → True</text><path d="M150.0 133 v32" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="170" width="276" height="118" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="197" font-weight="700">Отдельное действие</text><text x="24" y="223">append(&quot;Python&quot;)</text><text x="24" y="246">Теперь одна книга</text><path d="M150.0 291 v32" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="328" width="276" height="118" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="355" font-weight="700">После добавления</text><text x="24" y="381">1 книга, limit = 1</text><text x="24" y="404">has_room() → False</text></g></svg>