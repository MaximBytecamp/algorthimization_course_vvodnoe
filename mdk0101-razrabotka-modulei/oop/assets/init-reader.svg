<svg xmlns="http://www.w3.org/2000/svg" width="700" height="347" viewBox="0 0 700 347" role="img" aria-labelledby="title desc"><title id="title">Инициализатор дважды создаёт отдельный список</title><desc id="desc">Вызов Reader для Ани создаёт список A. Вызов Reader для Ильи создаёт другой список B. self ссылается на соответствующий экземпляр.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="700" height="347" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="12" width="310" height="140" rx="0" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><path d="M13 53 H321" stroke="#020835"/><text x="26" y="39" font-weight="700" fill="#020835">Reader(«Аня»)</text><text x="26" y="78">__init__: self → first</text><text x="26" y="103">self.books = []</text><path d="M335 82 L383 82" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="398" y="12" width="290" height="140" rx="0" fill="#BFE2F5" stroke="#2D7FC1" stroke-width="2.5"/><path d="M399 53 H687" stroke="#2D7FC1"/><text x="412" y="39" font-weight="700" fill="#020835">first.books</text><text x="412" y="78">новый пустой список A</text><rect x="12" y="190" width="310" height="140" rx="0" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><path d="M13 231 H321" stroke="#020835"/><text x="26" y="217" font-weight="700" fill="#020835">Reader(«Илья»)</text><text x="26" y="256">__init__: self → second</text><text x="26" y="281">self.books = []</text><path d="M335 260 L383 260" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="398" y="190" width="290" height="140" rx="0" fill="#BFE2F5" stroke="#2D7FC1" stroke-width="2.5"/><path d="M399 231 H687" stroke="#2D7FC1"/><text x="412" y="217" font-weight="700" fill="#020835">second.books</text><text x="412" y="256">новый пустой список B</text></g></svg>