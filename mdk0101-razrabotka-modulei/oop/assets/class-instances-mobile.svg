<svg xmlns="http://www.w3.org/2000/svg" width="320" height="510" viewBox="0 0 320 510" role="img" aria-labelledby="title desc"><title id="title">Имена и экземпляры отделены от класса</title><desc id="desc">Два вызова Reader создают разные экземпляры A и B. Отдельные имена first и second ссылаются каждое на свой экземпляр.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#246795"/></marker></defs><rect width="320" height="510" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="12" width="296" height="110" rx="7" fill="#eeedf8" stroke="#65539b" stroke-width="2"/><path d="M13 53 H307" stroke="#65539b"/><text x="26" y="39" font-weight="700" fill="#65539b">Класс Reader</text><text x="26" y="78">Общее описание</text><path d="M225 133 L225 214" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/><text x="225" y="177" text-anchor="middle" font-size="14" fill="#246795">Reader()</text><path d="M300 133 L316 133 L316 370 L230 370 L230 377" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="242" width="92" height="80" rx="7" fill="#fff3da" stroke="#80601f" stroke-width="2"/><path d="M13 283 H103" stroke="#80601f"/><text x="26" y="269" font-weight="700" fill="#80601f">first</text><path d="M112 281 L140 281" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="153" y="227" width="155" height="125" rx="7" fill="#edf6fb" stroke="#246795" stroke-width="2"/><path d="M154 268 H307" stroke="#246795"/><text x="167" y="254" font-weight="700" fill="#246795">Экземпляр A</text><text x="167" y="293">тип: Reader</text><rect x="12" y="402" width="92" height="80" rx="7" fill="#fff3da" stroke="#80601f" stroke-width="2"/><path d="M13 443 H103" stroke="#80601f"/><text x="26" y="429" font-weight="700" fill="#80601f">second</text><path d="M112 441 L140 441" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="153" y="387" width="155" height="110" rx="7" fill="#edf6fb" stroke="#246795" stroke-width="2"/><path d="M154 428 H307" stroke="#246795"/><text x="167" y="414" font-weight="700" fill="#246795">Экземпляр B</text><text x="167" y="453">тип: Reader</text></g></svg>