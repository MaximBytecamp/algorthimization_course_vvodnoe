<svg xmlns="http://www.w3.org/2000/svg" width="700" height="608" viewBox="0 0 700 608" role="img" aria-labelledby="title desc"><title id="title">Равенство и идентичность списков до изменения</title><desc id="desc">В первом опыте две стрелки сходятся на одном списке A. Во втором каждая ведёт к своему списку. Содержимое совпадает в обоих опытах; идентичность — только в первом.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="700" height="608" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="16" width="676" height="276" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="24" y="44" font-weight="700">Опыт 1. Общий список</text><text x="24" y="73">first = [&quot;ручка&quot;]</text><text x="24" y="99">second = first</text><rect x="24" y="122" width="86" height="36" fill="#fff" stroke="#020835" stroke-width="2.5"/><text x="34" y="146">first</text><path d="M116 140 L510 167" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="176" width="86" height="36" fill="#fff" stroke="#020835" stroke-width="2.5"/><text x="34" y="200">second</text><path d="M116 194 L510 167" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="518" y="149" width="152" height="36" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="528" y="173">A: [&quot;ручка&quot;]</text><text x="24" y="248" font-weight="700">first == second → True</text><text x="24" y="273" font-weight="700">first is second → True</text><rect x="12" y="316" width="676" height="276" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="24" y="344" font-weight="700">Опыт 2. Отдельные списки</text><text x="24" y="373">first = [&quot;ручка&quot;]</text><text x="24" y="399">second = [&quot;ручка&quot;]</text><rect x="24" y="422" width="86" height="36" fill="#fff" stroke="#020835" stroke-width="2.5"/><text x="34" y="446">first</text><rect x="518" y="422" width="152" height="36" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="528" y="446">A: [&quot;ручка&quot;]</text><path d="M116 440 H510" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="476" width="86" height="36" fill="#fff" stroke="#020835" stroke-width="2.5"/><text x="34" y="500">second</text><rect x="518" y="476" width="152" height="36" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="528" y="500">B: [&quot;ручка&quot;]</text><path d="M116 494 H510" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><text x="24" y="548" font-weight="700">first == second → True</text><text x="24" y="573" font-weight="700">first is second → False</text></g></svg>
