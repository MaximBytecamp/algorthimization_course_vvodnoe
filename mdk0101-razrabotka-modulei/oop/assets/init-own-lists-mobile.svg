<svg xmlns="http://www.w3.org/2000/svg" width="360" height="334" viewBox="0 0 360 334" role="img" aria-labelledby="title desc"><title id="title">Списки после выдачи первому читателю</title><desc id="desc">Поля показывают два независимых экземпляра после append. A и B — разные списки; стрелки обозначают ссылки.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="360" height="334" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="16" width="336" height="130" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="26" y="44" font-weight="700">Первый вызов __init__</text><text x="26" y="72">first → экземпляр Ани</text><text x="26" y="98">first.books → список A</text><text x="26" y="124">A: [&quot;Python&quot;]</text><rect x="12" y="188" width="336" height="130" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="26" y="216" font-weight="700">Второй вызов __init__</text><text x="26" y="244">second → экземпляр Ильи</text><text x="26" y="270">second.books → список B</text><text x="26" y="296">B: []</text></g></svg>
