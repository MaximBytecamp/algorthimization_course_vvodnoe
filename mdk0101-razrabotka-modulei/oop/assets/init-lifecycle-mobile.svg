<svg xmlns="http://www.w3.org/2000/svg" width="360" height="454" viewBox="0 0 360 454" role="img" aria-labelledby="title desc"><title id="title">Порядок выполнения Reader(&quot;Аня&quot;)</title><desc id="desc">Читаем сверху вниз. Стрелки между полями показывают порядок, стрелки в строках — ссылки или значения атрибутов.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="360" height="454" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="16" width="336" height="104" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="26" y="44" font-weight="700">1. Создан экземпляр Reader</text><text x="26" y="72">self → новый экземпляр</text><text x="26" y="98">name и books ещё не присвоены</text><path d="M180 125 v25" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="162" width="336" height="130" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="26" y="190" font-weight="700">2. Выполняется __init__</text><text x="26" y="218">self.name → &quot;Аня&quot;</text><text x="26" y="244">self.books → новый пустой список</text><text x="26" y="270">Вывод: Инициализация: Аня</text><path d="M180 297 v25" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="334" width="336" height="104" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="26" y="362" font-weight="700">3. Вызов класса завершён</text><text x="26" y="390">reader → тот же экземпляр</text><text x="26" y="416">Внешний вывод: Аня []</text></g></svg>
