<svg xmlns="http://www.w3.org/2000/svg" width="300" height="458" viewBox="0 0 300 458" role="img" aria-labelledby="title desc"><title id="title">Запасной перебор через целочисленные индексы</title><desc id="desc">Стрелки — последовательностный запасной путь. Ошибка границы превращается в завершение прохода; длина не управляет этим перебором.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#2D7FC1"/></marker></defs><rect width="300" height="458" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="15" fill="#020835"><rect x="12" y="12" width="276" height="118" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="39" font-weight="700">iter(books)</text><text x="24" y="65">Своего __iter__ нет</text><text x="24" y="88">Есть __getitem__</text><path d="M150.0 133 v32" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="170" width="276" height="118" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="197" font-weight="700">Запросы по очереди</text><text x="24" y="223">Индексы 0, 1, 2</text><text x="24" y="246">Три названия</text><path d="M150.0 291 v32" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="328" width="276" height="118" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="355" font-weight="700">Граница: индекс 3</text><text x="24" y="381">__getitem__: IndexError</text><text x="24" y="404">Итератор завершён</text></g></svg>