<svg xmlns="http://www.w3.org/2000/svg" width="700" height="334" viewBox="0 0 700 334" role="img" aria-labelledby="title desc"><title id="title">Параметры и сохранённые атрибуты</title><desc id="desc">Верхнее поле — параметры одного вызова. Нижнее — данные экземпляра после этого вызова.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="700" height="334" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="16" width="676" height="130" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="26" y="44" font-weight="700">Reader(&quot;Аня&quot;)</text><text x="26" y="72">name → &quot;Аня&quot;; limit → 3</text><text x="26" y="98">self.name = name</text><text x="26" y="124">self.limit = limit</text><path d="M350 151 v25" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="188" width="676" height="130" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="26" y="216" font-weight="700">После завершения вызова</text><text x="26" y="244">first.name → &quot;Аня&quot;</text><text x="26" y="270">first.limit → 3</text><text x="26" y="296">first.books → []</text></g></svg>
