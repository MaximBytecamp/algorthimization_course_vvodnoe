<svg xmlns="http://www.w3.org/2000/svg" width="700" height="230" viewBox="0 0 700 230" role="img" aria-labelledby="title desc"><title id="title">Два имени ссылаются на один список</title><desc id="desc">Стрелки от first и second сходятся на одном списке. Добавление через second видно и через first.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#246795"/></marker></defs><rect width="700" height="230" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="10" y="20" width="160" height="82" rx="7" fill="#fff3da" stroke="#80601f" stroke-width="2"/><path d="M11 61 H169" stroke="#80601f"/><text x="24" y="47" font-weight="700" fill="#80601f">first</text><rect x="10" y="136" width="160" height="82" rx="7" fill="#fff3da" stroke="#80601f" stroke-width="2"/><path d="M11 177 H169" stroke="#80601f"/><text x="24" y="163" font-weight="700" fill="#80601f">second</text><path d="M180 61 L330 91" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M180 177 L330 152" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="346" y="30" width="342" height="170" rx="7" fill="#edf6fb" stroke="#246795" stroke-width="2"/><path d="M347 71 H687" stroke="#246795"/><text x="360" y="57" font-weight="700" fill="#246795">Один список</text><text x="360" y="96">[0] «ручка»</text><text x="360" y="121">[1] «тетрадь»</text><text x="360" y="146">first is second → True</text></g></svg>