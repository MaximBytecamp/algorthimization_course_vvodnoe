<svg xmlns="http://www.w3.org/2000/svg" width="700" height="666" viewBox="0 0 700 666" role="img" aria-labelledby="title desc"><title id="title">Создание и инициализация одного Reader</title><desc id="desc">Четыре последовательных этапа выполнения first = Reader(&quot;Аня&quot;). Имя first связывается с экземпляром только после успешного завершения вызова.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="700" height="666" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="16" width="676" height="106" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="26" y="45" font-weight="700">1. Вызов класса</text><text x="26" y="75">first = Reader(&quot;Аня&quot;)</text><text x="26" y="101">Начинается вычисление справа от =.</text><path d="M350 128 v26" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="166" width="676" height="106" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="26" y="195" font-weight="700">2. Создание экземпляра</text><text x="26" y="225">Появляется новый объект Reader.</text><text x="26" y="251">Атрибутов name и books ещё нет.</text><path d="M350 278 v26" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="316" width="676" height="158" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="26" y="345" font-weight="700">3. Инициализация</text><text x="26" y="375">self → этот новый экземпляр</text><text x="26" y="401">name → &quot;Аня&quot;</text><text x="26" y="427">self.name = name</text><text x="26" y="453">self.books = []</text><path d="M350 480 v26" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="518" width="676" height="132" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="26" y="547" font-weight="700">4. Результат и присваивание</text><text x="26" y="577">first → тот же экземпляр Reader</text><text x="26" y="603">name: &quot;Аня&quot;; books → новый []</text><text x="26" y="629">Вызов завершён, имя first связано.</text></g></svg>
