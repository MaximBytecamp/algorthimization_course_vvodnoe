<svg xmlns="http://www.w3.org/2000/svg" width="320" height="362" viewBox="0 0 320 362" role="img" aria-labelledby="title desc"><title id="title">Два имени ссылаются на один список</title><desc id="desc">Стрелки от first и second сходятся на одном списке. Добавление через second видно и через first.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#246795"/></marker></defs><rect width="320" height="362" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="12" width="136" height="82" rx="7" fill="#fff3da" stroke="#80601f" stroke-width="2"/><path d="M13 53 H147" stroke="#80601f"/><text x="26" y="39" font-weight="700" fill="#80601f">first</text><rect x="172" y="12" width="136" height="82" rx="7" fill="#fff3da" stroke="#80601f" stroke-width="2"/><path d="M173 53 H307" stroke="#80601f"/><text x="186" y="39" font-weight="700" fill="#80601f">second</text><path d="M80 99 L80 168" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M240 99 L240 168" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="182" width="296" height="156" rx="7" fill="#edf6fb" stroke="#246795" stroke-width="2"/><path d="M13 223 H307" stroke="#246795"/><text x="26" y="209" font-weight="700" fill="#246795">Один список</text><text x="26" y="248">[0] «ручка»</text><text x="26" y="273">[1] «тетрадь»</text><text x="26" y="298">first is second → True</text></g></svg>