<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160" role="img" aria-labelledby="title desc"><title id="title">Что сохраняется в объекте, а что получает result</title><desc id="desc">Стрелки — этапы выполнения. В последнем блоке показаны две отдельные связи имён и атрибутов.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#2D7FC1"/></marker></defs><rect width="720" height="160" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="15" fill="#020835"><rect x="12" y="16" width="218" height="118" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="43" font-weight="700">Вызов</text><text x="24" y="69">reader.borrow(...)</text><text x="24" y="92">Получатель: reader</text><path d="M233 75.0 h14" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="250" y="16" width="218" height="118" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="262" y="43" font-weight="700">Внутри метода</text><text x="262" y="69">books.append(...)</text><text x="262" y="92">Список изменён</text><path d="M471 75.0 h14" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="488" y="16" width="218" height="118" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="500" y="43" font-weight="700">После вызова</text><text x="500" y="69">result → None</text><text x="500" y="92">reader.books → список</text></g></svg>