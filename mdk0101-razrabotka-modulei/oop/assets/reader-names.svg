<svg xmlns="http://www.w3.org/2000/svg" width="700" height="186" viewBox="0 0 700 186" role="img" aria-labelledby="title desc"><title id="title">Разные атрибуты name у двух экземпляров</title><desc id="desc">Присваивание имени Анна первому экземпляру не меняет имя Илья у второго.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="700" height="186" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="10" y="18" width="268" height="150" rx="0" fill="#BFE2F5" stroke="#2D7FC1" stroke-width="2.5"/><path d="M11 59 H277" stroke="#2D7FC1"/><text x="24" y="45" font-weight="700" fill="#020835">first</text><text x="24" y="84">name: «Анна»</text><text x="24" y="109">после first.name = «Анна»</text><path d="M290 93 L410 93" fill="none" stroke="#2D7FC1" stroke-width="2.5" stroke-dasharray="4 5"/><text x="350.0" y="83.0" text-anchor="middle" font-size="14" fill="#2D7FC1">разные объекты</text><rect x="422" y="18" width="268" height="150" rx="0" fill="#BFE2F5" stroke="#2D7FC1" stroke-width="2.5"/><path d="M423 59 H689" stroke="#2D7FC1"/><text x="436" y="45" font-weight="700" fill="#020835">second</text><text x="436" y="84">name: «Илья»</text><text x="436" y="109">значение сохранено</text></g></svg>