<svg xmlns="http://www.w3.org/2000/svg" width="320" height="610" viewBox="0 0 320 610" role="img" aria-labelledby="title desc"><title id="title">Инициализатор дважды создаёт отдельный список</title><desc id="desc">Вызов Reader для Ани создаёт список A. Вызов Reader для Ильи создаёт другой список B. self ссылается на соответствующий экземпляр.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#246795"/></marker></defs><rect width="320" height="610" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="12" width="296" height="120" rx="7" fill="#eeedf8" stroke="#65539b" stroke-width="2"/><path d="M13 53 H307" stroke="#65539b"/><text x="26" y="39" font-weight="700" fill="#65539b">Reader(«Аня»)</text><text x="26" y="78">__init__: self → first</text><text x="26" y="103">self.books = []</text><path d="M160 145 L160 185" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="197" width="296" height="100" rx="7" fill="#edf6fb" stroke="#246795" stroke-width="2"/><path d="M13 238 H307" stroke="#246795"/><text x="26" y="224" font-weight="700" fill="#246795">first.books</text><text x="26" y="263">новый пустой список A</text><rect x="12" y="310" width="296" height="120" rx="7" fill="#eeedf8" stroke="#65539b" stroke-width="2"/><path d="M13 351 H307" stroke="#65539b"/><text x="26" y="337" font-weight="700" fill="#65539b">Reader(«Илья»)</text><text x="26" y="376">__init__: self → second</text><text x="26" y="401">self.books = []</text><path d="M160 443 L160 483" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="495" width="296" height="100" rx="7" fill="#edf6fb" stroke="#246795" stroke-width="2"/><path d="M13 536 H307" stroke="#246795"/><text x="26" y="522" font-weight="700" fill="#246795">second.books</text><text x="26" y="561">новый пустой список B</text></g></svg>