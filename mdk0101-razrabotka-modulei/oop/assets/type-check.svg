<svg xmlns="http://www.w3.org/2000/svg" width="700" height="186" viewBox="0 0 700 186" role="img" aria-labelledby="title desc"><title id="title">Различие между классом и экземпляром</title><desc id="desc">Reader — класс. reader — созданный объект этого класса. Обе проверки в примере возвращают True.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#246795"/></marker></defs><rect width="700" height="186" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="10" y="18" width="268" height="150" rx="7" fill="#eeedf8" stroke="#65539b" stroke-width="2"/><path d="M11 59 H277" stroke="#65539b"/><text x="24" y="45" font-weight="700" fill="#65539b">Reader</text><text x="24" y="84">сам класс</text><text x="24" y="109">type(reader) is Reader</text><path d="M290 93 L410 93" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/><text x="350.0" y="83.0" text-anchor="middle" font-size="14" fill="#246795">тип экземпляра</text><rect x="422" y="18" width="268" height="150" rx="7" fill="#edf6fb" stroke="#246795" stroke-width="2"/><path d="M423 59 H689" stroke="#246795"/><text x="436" y="45" font-weight="700" fill="#246795">reader</text><text x="436" y="84">экземпляр Reader</text><text x="436" y="109">isinstance(reader, Reader)</text></g></svg>