<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160" role="img" aria-labelledby="title desc"><title id="title">Операция, реализация и допустимый результат</title><desc id="desc">Стрелки связывают запрос, требования и проверку поведения. Неизменность списка — смысловая договорённость нашей модели.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#2D7FC1"/></marker></defs><rect width="720" height="160" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="15" fill="#020835"><rect x="12" y="16" width="218" height="118" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="43" font-weight="700">Запрос</text><text x="24" y="69">len(reader)</text><text x="24" y="92">Узнать число книг</text><path d="M233 75.0 h14" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="250" y="16" width="218" height="118" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="262" y="43" font-weight="700">Требования</text><text x="262" y="69">__len__(self)</text><text x="262" y="92">Целое число ≥ 0</text><path d="M471 75.0 h14" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="488" y="16" width="218" height="118" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="500" y="43" font-weight="700">Наблюдаемое поведение</text><text x="500" y="69">Результат: 2</text><text x="500" y="92">Книги не изменились</text></g></svg>