<svg xmlns="http://www.w3.org/2000/svg" width="700" height="692" viewBox="0 0 700 692" role="img" aria-labelledby="title desc"><title id="title">Получатель и аргумент при вызове метода</title><desc id="desc">Для обычного метода Reader.borrow вызовы first.borrow(&quot;Python&quot;) и Reader.borrow(first, &quot;Python&quot;) выполняют одно действие. Это две альтернативы для одного вызова, а не два последовательных добавления.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="700" height="692" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="16" width="676" height="132" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="26" y="45" font-weight="700">1. Вызов через экземпляр</text><text x="26" y="75">first.borrow(&quot;Python&quot;)</text><text x="26" y="101">Получатель: first</text><text x="26" y="127">Явный аргумент: &quot;Python&quot;</text><path d="M350 154 v26" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="192" width="676" height="132" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="26" y="221" font-weight="700">2. Параметры текущего вызова</text><text x="26" y="251">def borrow(self, title):</text><text x="26" y="277">self → тот же объект, что и first</text><text x="26" y="303">title → &quot;Python&quot;</text><path d="M350 330 v26" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="368" width="676" height="132" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="26" y="397" font-weight="700">3. Выполнение тела</text><text x="26" y="427">self.books.append(title)</text><text x="26" y="453">В first.books добавляется &quot;Python&quot;.</text><text x="26" y="479">Итог: first.books → [&quot;Python&quot;]</text><rect x="12" y="544" width="676" height="132" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="26" y="573" font-weight="700">Другая запись того же вызова</text><text x="26" y="603">Reader.borrow(first, &quot;Python&quot;)</text><text x="26" y="629">Получатель передан явно.</text><text x="26" y="655">Выбираем одну из двух записей.</text></g></svg>
