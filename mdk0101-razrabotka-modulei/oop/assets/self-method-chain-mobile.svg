<svg xmlns="http://www.w3.org/2000/svg" width="360" height="334" viewBox="0 0 360 334" role="img" aria-labelledby="title desc"><title id="title">Два вызова выдачи при limit = 1</title><desc id="desc">Поля показывают два последовательных вызова. Внутренний вызов has_room использует тот же экземпляр.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="360" height="334" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="16" width="336" height="130" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="26" y="44" font-weight="700">Первая выдача: Python</text><text x="26" y="72">borrow: self → reader</text><text x="26" y="98">has_room: self → тот же reader</text><text x="26" y="124">0 &lt; 1 → True; books: [&quot;Python&quot;]</text><path d="M180 151 v25" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="188" width="336" height="130" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="26" y="216" font-weight="700">Вторая выдача: Алгоритмы</text><text x="26" y="244">borrow: self → reader</text><text x="26" y="270">has_room: self → тот же reader</text><text x="26" y="296">1 &lt; 1 → False; books без изменений</text></g></svg>
