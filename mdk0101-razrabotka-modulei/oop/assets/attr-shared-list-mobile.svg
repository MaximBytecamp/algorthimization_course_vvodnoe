<svg xmlns="http://www.w3.org/2000/svg" width="360" height="455" viewBox="0 0 360 455" role="img" aria-labelledby="title desc"><title id="title">Два пути чтения к одному списку класса</title><desc id="desc">Оба экземпляра не имеют своего books. Две стрелки поиска сходятся у класса Reader. Его атрибут books ссылается на один список с Python.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="360" height="455" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="16" width="150" height="110" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="22" y="43" font-weight="700">first</text><text x="22" y="68">name: &quot;Аня&quot;</text><text x="22" y="93">своего books нет</text><rect x="198" y="16" width="150" height="110" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="208" y="43" font-weight="700">second</text><text x="208" y="68">name: &quot;Илья&quot;</text><text x="208" y="93">своего books нет</text><rect x="20" y="200" width="320" height="85" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="30" y="227" font-weight="700">Класс Reader</text><text x="30" y="252">books → общий список</text><path d="M87 134 L158 188" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M273 134 L202 188" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="352" width="320" height="85" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="30" y="379" font-weight="700">Общий список</text><text x="30" y="404">[&quot;Python&quot;]</text><path d="M180 293 V340" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/></g></svg>
