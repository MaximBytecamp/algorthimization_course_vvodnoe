<svg xmlns="http://www.w3.org/2000/svg" width="320" height="590" viewBox="0 0 320 590" role="img" aria-labelledby="title desc"><title id="title">Разные получатели двух вызовов borrow</title><desc id="desc">В первом вызове self ссылается на first и добавляет Python в first.books. Во втором self ссылается на second и добавляет Алгоритмы в second.books.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="320" height="590" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="12" width="296" height="108" rx="0" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><path d="M13 53 H307" stroke="#020835"/><text x="26" y="39" font-weight="700" fill="#020835">first.borrow(...)</text><text x="26" y="78">self → first</text><text x="26" y="103">title → «Python»</text><path d="M160 132 L160 177" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><text x="215" y="158" text-anchor="middle" font-size="14" fill="#2D7FC1">append</text><rect x="12" y="192" width="296" height="90" rx="0" fill="#BFE2F5" stroke="#2D7FC1" stroke-width="2.5"/><path d="M13 233 H307" stroke="#2D7FC1"/><text x="26" y="219" font-weight="700" fill="#020835">first.books</text><text x="26" y="258">[«Python»]</text><rect x="12" y="306" width="296" height="108" rx="0" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><path d="M13 347 H307" stroke="#020835"/><text x="26" y="333" font-weight="700" fill="#020835">second.borrow(...)</text><text x="26" y="372">self → second</text><text x="26" y="397">title → «Алгоритмы»</text><path d="M160 426 L160 471" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><text x="215" y="452" text-anchor="middle" font-size="14" fill="#2D7FC1">append</text><rect x="12" y="486" width="296" height="90" rx="0" fill="#BFE2F5" stroke="#2D7FC1" stroke-width="2.5"/><path d="M13 527 H307" stroke="#2D7FC1"/><text x="26" y="513" font-weight="700" fill="#020835">second.books</text><text x="26" y="552">[«Алгоритмы»]</text></g></svg>