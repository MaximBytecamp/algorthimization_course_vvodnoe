<svg xmlns="http://www.w3.org/2000/svg" width="700" height="308" viewBox="0 0 700 308" role="img" aria-labelledby="title desc"><title id="title">Где появился ключ library</title><desc id="desc">Поля показывают разные словари атрибутов. У класса есть и другие служебные ключи; здесь выделен только library.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="700" height="308" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="16" width="676" height="130" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="26" y="44" font-weight="700">vars(reader) после присваивания</text><text x="26" y="72">name → &quot;Аня&quot;</text><text x="26" y="98">books → []</text><text x="26" y="124">library → &quot;Филиал&quot;</text><rect x="12" y="188" width="676" height="104" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="26" y="216" font-weight="700">vars(Reader), выбранный ключ</text><text x="26" y="244">library → &quot;Центральная&quot;</text><text x="26" y="270">Значение класса сохранилось</text></g></svg>
