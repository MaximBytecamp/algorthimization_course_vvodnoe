<svg xmlns="http://www.w3.org/2000/svg" width="320" height="573" viewBox="0 0 320 573" role="img" aria-labelledby="title desc"><title id="title">Изменение ссылки text при неизменной исходной строке</title><desc id="desc">До: text и old_text ссылаются на одну строку. После: old_text указывает на прежнюю строку, text — на новый результат.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#246795"/></marker></defs><rect width="320" height="573" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><text x="12" y="25" font-weight="700">До соединения</text><rect x="12" y="42" width="116" height="75" rx="7" fill="#fff3da" stroke="#80601f" stroke-width="2"/><path d="M13 83 H127" stroke="#80601f"/><text x="26" y="69" font-weight="700" fill="#80601f">old_text</text><rect x="12" y="162" width="116" height="75" rx="7" fill="#fff3da" stroke="#80601f" stroke-width="2"/><path d="M13 203 H127" stroke="#80601f"/><text x="26" y="189" font-weight="700" fill="#80601f">text</text><rect x="180" y="102" width="128" height="90" rx="7" fill="#edf6fb" stroke="#246795" stroke-width="2"/><path d="M181 143 H307" stroke="#246795"/><text x="194" y="129" font-weight="700" fill="#246795">Одна строка</text><text x="194" y="168">«склад»</text><path d="M138 80 L168 132" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M138 200 L168 162" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/><text x="12" y="295" font-weight="700">После text = text + « № 2»</text><rect x="12" y="316" width="116" height="75" rx="7" fill="#fff3da" stroke="#80601f" stroke-width="2"/><path d="M13 357 H127" stroke="#80601f"/><text x="26" y="343" font-weight="700" fill="#80601f">old_text</text><rect x="12" y="436" width="116" height="75" rx="7" fill="#fff3da" stroke="#80601f" stroke-width="2"/><path d="M13 477 H127" stroke="#80601f"/><text x="26" y="463" font-weight="700" fill="#80601f">text</text><rect x="180" y="316" width="128" height="85" rx="7" fill="#edf6fb" stroke="#246795" stroke-width="2"/><path d="M181 357 H307" stroke="#246795"/><text x="194" y="343" font-weight="700" fill="#246795">Строка</text><text x="194" y="382">«склад»</text><rect x="180" y="436" width="128" height="106" rx="7" fill="#edf6fb" stroke="#246795" stroke-width="2"/><path d="M181 477 H307" stroke="#246795"/><text x="194" y="463" font-weight="700" fill="#246795">Результат</text><text x="194" y="502">«склад № 2»</text><path d="M138 354 L168 354" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M138 474 L168 474" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/></g></svg>