<svg xmlns="http://www.w3.org/2000/svg" width="700" height="454" viewBox="0 0 700 454" role="img" aria-labelledby="title desc"><title id="title">Общий счётчик после проверок регистрации</title><desc id="desc">Читаем сверху вниз. Во всех полях изменяется один атрибут класса; отклонённая регистрация его не меняет.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="700" height="454" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="16" width="676" height="104" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="26" y="44" font-weight="700">Reader(&quot;Аня&quot;)</text><text x="26" y="72">Проверка пройдена</text><text x="26" y="98">Reader.registrations: 0 → 1</text><path d="M350 125 v25" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="162" width="676" height="104" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="26" y="190" font-weight="700">Reader(&quot;Илья&quot;)</text><text x="26" y="218">Проверка пройдена</text><text x="26" y="244">Reader.registrations: 1 → 2</text><path d="M350 271 v25" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="308" width="676" height="130" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="26" y="336" font-weight="700">Reader(&quot;   &quot;)</text><text x="26" y="364">Проверка завершилась ValueError</text><text x="26" y="390">До увеличения выполнение не дошло</text><text x="26" y="416">Reader.registrations осталось 2</text></g></svg>
