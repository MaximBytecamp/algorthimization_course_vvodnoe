<svg xmlns="http://www.w3.org/2000/svg" width="700" height="445" viewBox="0 0 700 445" role="img" aria-labelledby="title desc"><title id="title">Собственные списки экземпляров и общая настройка</title><desc id="desc">У first и second собственные атрибуты books. Стрелки ведут к отдельным спискам A и B. Общий атрибут library хранится в классе Reader.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="700" height="445" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="16" width="320" height="110" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="22" y="43" font-weight="700">first</text><text x="22" y="68">name: &quot;Аня&quot;</text><text x="22" y="93">books</text><rect x="368" y="16" width="320" height="110" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="378" y="43" font-weight="700">second</text><text x="378" y="68">name: &quot;Илья&quot;</text><text x="378" y="93">books</text><rect x="12" y="193" width="320" height="85" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="22" y="220" font-weight="700">Список A</text><text x="22" y="245">[&quot;Python&quot;]</text><rect x="368" y="193" width="320" height="85" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="378" y="220" font-weight="700">Список B</text><text x="378" y="245">[]</text><path d="M172 134 V181" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M528 134 V181" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="343" width="676" height="85" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="22" y="370" font-weight="700">Класс Reader</text><text x="22" y="395">library: &quot;Центральная&quot;</text></g></svg>
