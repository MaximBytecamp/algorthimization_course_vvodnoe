<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430" role="img" aria-labelledby="title desc"><title id="title">Имена и экземпляры отделены от класса</title><desc id="desc">Два вызова Reader создают разные экземпляры A и B. Отдельные имена first и second ссылаются каждое на свой экземпляр.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="700" height="430" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="205" y="12" width="290" height="110" rx="0" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><path d="M206 53 H494" stroke="#020835"/><text x="219" y="39" font-weight="700" fill="#020835">Класс Reader</text><text x="219" y="78">Общее описание</text><path d="M270 134 L167 208" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><text x="190" y="168" text-anchor="middle" font-size="14" fill="#2D7FC1">Reader()</text><path d="M430 134 L535 208" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><text x="520" y="168" text-anchor="middle" font-size="14" fill="#2D7FC1">Reader()</text><rect x="12" y="222" width="310" height="112" rx="0" fill="#BFE2F5" stroke="#2D7FC1" stroke-width="2.5"/><path d="M13 263 H321" stroke="#2D7FC1"/><text x="26" y="249" font-weight="700" fill="#020835">Экземпляр A</text><text x="26" y="288">тип: Reader</text><rect x="378" y="222" width="310" height="112" rx="0" fill="#BFE2F5" stroke="#2D7FC1" stroke-width="2.5"/><path d="M379 263 H687" stroke="#2D7FC1"/><text x="392" y="249" font-weight="700" fill="#020835">Экземпляр B</text><text x="392" y="288">тип: Reader</text><rect x="72" y="365" width="190" height="54" rx="0" fill="#FFFFFF" stroke="#020835" stroke-width="2.5"/><path d="M73 406 H261" stroke="#020835"/><text x="86" y="392" font-weight="700" fill="#020835">first</text><path d="M167 357 L167 345" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="438" y="365" width="190" height="54" rx="0" fill="#FFFFFF" stroke="#020835" stroke-width="2.5"/><path d="M439 406 H627" stroke="#020835"/><text x="452" y="392" font-weight="700" fill="#020835">second</text><path d="M533 357 L533 345" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/></g></svg>