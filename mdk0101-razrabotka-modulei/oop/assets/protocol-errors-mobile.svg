<svg xmlns="http://www.w3.org/2000/svg" width="300" height="538" viewBox="0 0 300 538" role="img" aria-labelledby="title desc"><title id="title">Ошибки трёх независимых вызовов len</title><desc id="desc">Каждая дорожка: тип объекта, причина отказа, исключение. Между дорожками переходов нет.</desc><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5Z" fill="#2D7FC1"/></marker></defs><rect width="300" height="538" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="15" fill="#020835"><rect x="12" y="12" width="276" height="43" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="38" font-weight="700">NoLength</text><path d="M150 56 v8" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="65" width="276" height="43" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="91" font-weight="700">Метода нет</text><path d="M150 109 v8" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="118" width="276" height="43" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="144" font-weight="700">TypeError</text><rect x="12" y="186" width="276" height="43" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="212" font-weight="700">TextLength</text><path d="M150 230 v8" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="239" width="276" height="43" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="265" font-weight="700">Ответ: &quot;2&quot;</text><path d="M150 283 v8" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="292" width="276" height="43" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="318" font-weight="700">TypeError</text><rect x="12" y="360" width="276" height="43" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="386" font-weight="700">NegativeLength</text><path d="M150 404 v8" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="413" width="276" height="43" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="439" font-weight="700">Ответ: −1</text><path d="M150 457 v8" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="466" width="276" height="43" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="492" font-weight="700">ValueError</text></g></svg>