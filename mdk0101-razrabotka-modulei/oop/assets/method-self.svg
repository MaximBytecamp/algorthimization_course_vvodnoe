<svg xmlns="http://www.w3.org/2000/svg" width="700" height="347" viewBox="0 0 700 347" role="img" aria-labelledby="title desc"><title id="title">Разные получатели двух вызовов borrow</title><desc id="desc">В первом вызове self ссылается на first и добавляет Python в first.books. Во втором self ссылается на second и добавляет Алгоритмы в second.books.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#246795"/></marker></defs><rect width="700" height="347" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="12" width="296" height="140" rx="7" fill="#eeedf8" stroke="#65539b" stroke-width="2"/><path d="M13 53 H307" stroke="#65539b"/><text x="26" y="39" font-weight="700" fill="#65539b">first.borrow(...)</text><text x="26" y="78">self → first</text><text x="26" y="103">title → «Python»</text><path d="M320 82 L388 82" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="402" y="12" width="286" height="140" rx="7" fill="#edf6fb" stroke="#246795" stroke-width="2"/><path d="M403 53 H687" stroke="#246795"/><text x="416" y="39" font-weight="700" fill="#246795">first.books</text><text x="416" y="78">[«Python»]</text><rect x="12" y="190" width="296" height="140" rx="7" fill="#eeedf8" stroke="#65539b" stroke-width="2"/><path d="M13 231 H307" stroke="#65539b"/><text x="26" y="217" font-weight="700" fill="#65539b">second.borrow(...)</text><text x="26" y="256">self → second</text><text x="26" y="281">title → «Алгоритмы»</text><path d="M320 260 L388 260" fill="none" stroke="#246795" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="402" y="190" width="286" height="140" rx="7" fill="#edf6fb" stroke="#246795" stroke-width="2"/><path d="M403 231 H687" stroke="#246795"/><text x="416" y="217" font-weight="700" fill="#246795">second.books</text><text x="416" y="256">[«Алгоритмы»]</text></g></svg>