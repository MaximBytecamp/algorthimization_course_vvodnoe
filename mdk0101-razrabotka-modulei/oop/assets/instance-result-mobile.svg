<svg xmlns="http://www.w3.org/2000/svg" width="300" height="458" viewBox="0 0 300 458" role="img" aria-labelledby="title desc"><title id="title">Что сохраняется в объекте, а что получает result</title><desc id="desc">Стрелки — этапы выполнения. В последнем блоке показаны две отдельные связи имён и атрибутов.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#2D7FC1"/></marker></defs><rect width="300" height="458" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="15" fill="#020835"><rect x="12" y="12" width="276" height="118" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="39" font-weight="700">Вызов</text><text x="24" y="65">reader.borrow(...)</text><text x="24" y="88">Получатель: reader</text><path d="M150.0 133 v32" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="170" width="276" height="118" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="197" font-weight="700">Внутри метода</text><text x="24" y="223">books.append(...)</text><text x="24" y="246">Список изменён</text><path d="M150.0 291 v32" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="12" y="328" width="276" height="118" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="355" font-weight="700">После вызова</text><text x="24" y="381">result → None</text><text x="24" y="404">reader.books → список</text></g></svg>