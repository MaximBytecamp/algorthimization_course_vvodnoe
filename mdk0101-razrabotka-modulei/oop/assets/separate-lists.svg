<svg xmlns="http://www.w3.org/2000/svg" width="700" height="276" viewBox="0 0 700 276" role="img" aria-labelledby="title desc"><title id="title">Изменение второго из двух независимых списков</title><desc id="desc">first ссылается на список с ручкой. second ссылается на другой список, куда добавлена тетрадь.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="700" height="276" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="10" y="20" width="160" height="82" rx="0" fill="#FFFFFF" stroke="#020835" stroke-width="2.5"/><path d="M11 61 H169" stroke="#020835"/><text x="24" y="47" font-weight="700" fill="#020835">first</text><path d="M180 61 L330 61" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="346" y="12" width="342" height="100" rx="0" fill="#BFE2F5" stroke="#2D7FC1" stroke-width="2.5"/><path d="M347 53 H687" stroke="#2D7FC1"/><text x="360" y="39" font-weight="700" fill="#020835">Список A</text><text x="360" y="78">[0] «ручка»</text><rect x="10" y="152" width="160" height="82" rx="0" fill="#FFFFFF" stroke="#020835" stroke-width="2.5"/><path d="M11 193 H169" stroke="#020835"/><text x="24" y="179" font-weight="700" fill="#020835">second</text><path d="M180 193 L330 193" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="346" y="132" width="342" height="130" rx="0" fill="#BFE2F5" stroke="#2D7FC1" stroke-width="2.5"/><path d="M347 173 H687" stroke="#2D7FC1"/><text x="360" y="159" font-weight="700" fill="#020835">Список B</text><text x="360" y="198">[0] «ручка»</text><text x="360" y="223">[1] «тетрадь»</text></g></svg>