<svg xmlns="http://www.w3.org/2000/svg" width="360" height="428" viewBox="0 0 360 428" role="img" aria-labelledby="title desc"><title id="title">Затенение и возврат к значению класса</title><desc id="desc">Читаем сверху вниз. В каждом поле показано состояние после соответствующей команды.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="360" height="428" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="16" width="336" height="104" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="26" y="44" font-weight="700">1. first.library = &quot;Филиал&quot;</text><text x="26" y="72">first: своё library → &quot;Филиал&quot;</text><text x="26" y="98">second читает → &quot;Центральная&quot;</text><path d="M180 125 v25" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="162" width="336" height="104" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="26" y="190" font-weight="700">2. Reader.library = &quot;Городская&quot;</text><text x="26" y="218">first читает своё → &quot;Филиал&quot;</text><text x="26" y="244">second читает класс → &quot;Городская&quot;</text><path d="M180 271 v25" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="308" width="336" height="104" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="26" y="336" font-weight="700">3. del first.library</text><text x="26" y="364">Своё library у first удалено</text><text x="26" y="390">Оба читают класс → &quot;Городская&quot;</text></g></svg>
