<svg xmlns="http://www.w3.org/2000/svg" width="700" height="282" viewBox="0 0 700 282" role="img" aria-labelledby="title desc"><title id="title">Параметр name и атрибут self.name</title><desc id="desc">Поля показывают два последовательных состояния одного вызова. Присваивание без self меняет локальное имя.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="700" height="282" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="16" width="676" height="104" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="26" y="44" font-weight="700">После self.name = name</text><text x="26" y="72">Локальное name → &quot;Анна&quot;</text><text x="26" y="98">reader.name → &quot;Анна&quot;</text><path d="M350 125 v25" fill="none" stroke="#2D7FC1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="12" y="162" width="676" height="104" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="26" y="190" font-weight="700">После name = &quot;Локальная строка&quot;</text><text x="26" y="218">Локальное name изменилось</text><text x="26" y="244">reader.name по-прежнему → &quot;Анна&quot;</text></g></svg>
