<svg xmlns="http://www.w3.org/2000/svg" width="700" height="454" viewBox="0 0 700 454" role="img" aria-labelledby="title desc"><title id="title">Общие данные класса и собственные данные экземпляров</title><desc id="desc">Поля обозначают разные объекты, а не шаги программы. library хранится в классе; стрелки показывают, откуда читается значение.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="700" height="454" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="16" width="676" height="78" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="26" y="44" font-weight="700">Класс Reader</text><text x="26" y="72">library → &quot;Центральная&quot;</text><rect x="12" y="136" width="676" height="130" fill="#BFE2F5" stroke="#020835" stroke-width="2.5"/><text x="26" y="164" font-weight="700">Экземпляр first</text><text x="26" y="192">name → &quot;Аня&quot;</text><text x="26" y="218">собственного library нет</text><text x="26" y="244">first.library → Reader.library</text><rect x="12" y="308" width="676" height="130" fill="#F2F1E9" stroke="#020835" stroke-width="2.5"/><text x="26" y="336" font-weight="700">Экземпляр second</text><text x="26" y="364">name → &quot;Илья&quot;</text><text x="26" y="390">собственного library нет</text><text x="26" y="416">second.library → Reader.library</text></g></svg>
