<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-labelledby="title desc"><title id="title">Ошибки трёх независимых вызовов len</title><desc id="desc">Каждая дорожка: тип объекта, причина отказа, исключение. Между дорожками переходов нет.</desc><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5Z" fill="#2D7FC1"/></marker></defs><rect width="720" height="310" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="15" fill="#020835"><rect x="12" y="12" width="218" height="84" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="38" font-weight="700">NoLength</text><text x="24" y="68">Вызов len(obj)</text><path d="M232 54 h15" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="250" y="12" width="218" height="84" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="262" y="38" font-weight="700">Метода нет</text><text x="262" y="68">Проверка требований</text><path d="M470 54 h15" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="488" y="12" width="218" height="84" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="500" y="38" font-weight="700">TypeError</text><text x="500" y="68">Операция прервана</text><rect x="12" y="112" width="218" height="84" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="138" font-weight="700">TextLength</text><text x="24" y="168">Вызов len(obj)</text><path d="M232 154 h15" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="250" y="112" width="218" height="84" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="262" y="138" font-weight="700">Ответ: &quot;2&quot;</text><text x="262" y="168">Проверка требований</text><path d="M470 154 h15" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="488" y="112" width="218" height="84" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="500" y="138" font-weight="700">TypeError</text><text x="500" y="168">Операция прервана</text><rect x="12" y="212" width="218" height="84" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="24" y="238" font-weight="700">NegativeLength</text><text x="24" y="268">Вызов len(obj)</text><path d="M232 254 h15" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="250" y="212" width="218" height="84" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="262" y="238" font-weight="700">Ответ: −1</text><text x="262" y="268">Проверка требований</text><path d="M470 254 h15" fill="none" stroke="#2D7FC1" stroke-width="2" marker-end="url(#arrow)"/><rect x="488" y="212" width="218" height="84" fill="#F2F1E9" stroke="#020835" stroke-width="2"/><text x="500" y="238" font-weight="700">ValueError</text><text x="500" y="268">Операция прервана</text></g></svg>