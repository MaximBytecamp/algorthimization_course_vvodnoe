<svg xmlns="http://www.w3.org/2000/svg" width="320" height="374" viewBox="0 0 320 374" role="img" aria-labelledby="title desc"><title id="title">Разные атрибуты name у двух экземпляров</title><desc id="desc">Присваивание имени Анна первому экземпляру не меняет имя Илья у второго.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#2D7FC1"/></marker></defs><rect width="320" height="374" fill="#fffdf8"/><g font-family="system-ui, sans-serif" font-size="16" fill="#020835"><rect x="12" y="12" width="296" height="132" rx="0" fill="#BFE2F5" stroke="#2D7FC1" stroke-width="2.5"/><path d="M13 53 H307" stroke="#2D7FC1"/><text x="26" y="39" font-weight="700" fill="#020835">first</text><text x="26" y="78">name: «Анна»</text><text x="26" y="103">после first.name = «Анна»</text><path d="M160 151 L160 215" fill="none" stroke="#2D7FC1" stroke-width="2.5" stroke-dasharray="4 5"/><text x="225" y="188" text-anchor="middle" font-size="14" fill="#2D7FC1">разные объекты</text><rect x="12" y="229" width="296" height="132" rx="0" fill="#BFE2F5" stroke="#2D7FC1" stroke-width="2.5"/><path d="M13 270 H307" stroke="#2D7FC1"/><text x="26" y="256" font-weight="700" fill="#020835">second</text><text x="26" y="295">name: «Илья»</text><text x="26" y="320">значение сохранено</text></g></svg>