<!-- Замените существующую форму. Google Tag в head страницы сохраните. -->
<form id="lead-form" action="ВАШ_APPS_SCRIPT_URL" method="POST" target="submission-frame">
  <label>Имя
    <input name="name" required maxlength="200" autocomplete="off" placeholder="Иван Тестов">
  </label>
  <label>Email
    <input name="email" type="email" required maxlength="200" autocomplete="off" placeholder="student@example.com">
  </label>
  <label>Направление
    <select name="direction" required>
      <option value="">Выберите направление</option>
      <option value="frontend">Frontend</option>
      <option value="backend">Backend</option>
      <option value="data">Data</option>
    </select>
  </label>
  <input type="hidden" name="request_id" id="request_id">
  <input type="hidden" name="utm_source" id="utm_source">
  <input type="hidden" name="utm_medium" id="utm_medium">
  <input type="hidden" name="utm_campaign" id="utm_campaign">
  <button type="submit">Отправить заявку</button>
  <button type="reset">Новая заявка</button>
  <p id="form-status" role="status"></p>
</form>
<iframe name="submission-frame" id="submission-frame" title="Ответ приёмника заявок" hidden></iframe>
