# Публикует документацию на GitHub Pages: ReDoc по openapi.yaml и страницы видов
# ошибок, на которые ссылается поле type в Problem Details (RFC 9457, раздел 3.1.1).
# Источники — docs/STANDARDS.md, раздел 24.
name: Publish docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build ReDoc page
        run: npx --yes @redocly/cli@2 build-docs openapi/openapi.yaml --output site/index.html

      - name: Build problem type pages
        run: python3 scripts/build_docs.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
