# Форма ошибки в работе API. Поля «версия» и «операция» обязательны, как в форме
# Azure REST API Specs; пары «что произошло / что ожидали» — как у Kubernetes.
# Ссылки на эти формы — docs/STANDARDS.md, раздел 17.
name: Ошибка в работе API
description: Ответ сервера не совпадает с контрактом
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Об уязвимостях не пишите в issue: порядок описан в `docs/SECURITY.md`.

  - type: input
    id: version
    attributes:
      label: Версия API
      description: Значение info.version из /openapi.json
      placeholder: "1.1.0"
    validations:
      required: true

  - type: input
    id: operation
    attributes:
      label: Операция
      placeholder: "GET /api/v1/tickets/{ticket_id}"
    validations:
      required: true

  - type: input
    id: request_id
    attributes:
      label: X-Request-Id
      description: Значение заголовка из ответа — по нему запрос найдут в логах
      placeholder: "0b6f3c1e-2a9d-4a4f-9d7e-3f4a1c2b5d6e"

  - type: textarea
    id: request
    attributes:
      label: Запрос
      description: Без токенов и персональных данных
      render: http
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Что вернул сервер
      description: Status code, заголовки и тело
      render: json
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Что ожидали по контракту
      description: Ссылка на операцию в документации или фрагмент openapi.yaml
    validations:
      required: true
