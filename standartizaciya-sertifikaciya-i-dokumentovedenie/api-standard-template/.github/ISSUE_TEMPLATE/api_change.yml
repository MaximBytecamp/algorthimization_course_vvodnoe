# Форма предложения изменить контракт. Источники и варианты у других компаний —
# docs/STANDARDS.md, раздел 17.
name: Предложение изменить API
description: Новая операция, поле, параметр или изменение поведения существующей операции
title: "[API] "
labels: ["api-change"]
body:
  - type: markdown
    attributes:
      value: |
        Контракт сначала обсуждается, потом реализуется (API First).
        Прочитайте `docs/API_STYLE_GUIDE.md` и `docs/VERSIONING.md` перед заполнением.

  - type: dropdown
    id: kind
    attributes:
      label: Что предлагается
      options:
        - Новая операция
        - Новое поле или параметр
        - Изменение поведения существующей операции
        - Удаление или переименование
    validations:
      required: true

  - type: input
    id: operation
    attributes:
      label: Операция
      description: Метод и путь, которые затрагивает изменение
      placeholder: "PATCH /api/v1/tickets/{ticket_id}"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Какую задачу клиента это решает
      description: Опишите ситуацию, а не решение
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемый контракт
      description: Запрос и ответ так, как их увидит клиент
      render: http
    validations:
      required: true

  - type: dropdown
    id: compatibility
    attributes:
      label: Совместимость
      description: Как определить — docs/VERSIONING.md
      options:
        - Совместимое (MINOR)
        - Breaking change (MAJOR)
        - Не знаю, нужна оценка
    validations:
      required: true
