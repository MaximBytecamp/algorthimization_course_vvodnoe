name: Ошибка в документации
description: Документация расходится с поведением API или непонятна
title: "[DOCS] "
labels: ["documentation"]
body:
  - type: input
    id: where
    attributes:
      label: Где
      description: Файл, раздел или адрес страницы
      placeholder: "docs/ERRORS.md, таблица «Виды проблем»"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Что не так
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Как должно быть написано
