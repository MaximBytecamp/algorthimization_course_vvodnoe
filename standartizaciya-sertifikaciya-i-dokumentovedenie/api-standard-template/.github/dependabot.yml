# Еженедельные pull request с обновлением зависимостей.
# Варианты у OpenAPI Initiative, GitHub Docs и FastAPI — docs/STANDARDS.md, раздел 21.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
