# Стенд занятия 2 · MongoDB
# Тот же одиночный узел MongoDB 7, что и на занятии 1: порт 27017, без пароля.
# Данные занятия 2 лежат в seed/ и загружаются mongoimport или через Compass.
#   docker compose up -d      запустить
#   docker compose down -v    удалить вместе с данными (полный сброс)
services:
  mongo:
    image: mongo:7
    container_name: hh-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mongo-data:
