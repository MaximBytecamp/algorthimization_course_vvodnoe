# Стенд занятия 1 · MongoDB
# Поднимает один узел MongoDB на порту 27017. База пустая:
# первый документ студент создаёт сам, остальные импортирует из seed/resumes.json.
#   docker compose up -d      запустить
#   docker compose down -v    удалить вместе с данными (полный сброс)
services:
  mongo:
    image: mongo:7
    container_name: hh-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mongo-data:
