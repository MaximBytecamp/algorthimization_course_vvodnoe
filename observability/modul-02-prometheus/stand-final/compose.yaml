# Итоговый стенд модуля 2: приложение FastAPI и Prometheus в одной сети Compose.
# Файл настроек Prometheus выбирает переменная PROM_CONFIG, по умолчанию prometheus.yml.
name: prometheus-final
services:
  api:
    build: .
    ports: ['127.0.0.1:8020:8000']

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/${PROM_CONFIG:-prometheus.yml}
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports: ['127.0.0.1:9092:9090']
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on: [api]

volumes:
  prometheus-data:
