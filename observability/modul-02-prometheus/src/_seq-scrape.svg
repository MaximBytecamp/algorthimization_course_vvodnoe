<svg class="seq__svg" viewBox="0 0 760 452" role="img" aria-label="Один scrape: Prometheus запрашивает /metrics у приложения и записывает отсчёты в TSDB">
<g class="actor"><rect x="22" y="10" width="176" height="36" rx="4"/><text x="110" y="33">Prometheus</text></g>
<line class="life" x1="110" x2="110" y1="46" y2="444"/>
<g class="actor"><rect x="292" y="10" width="176" height="36" rx="4"/><text x="380" y="33">api:8000</text></g>
<line class="life" x1="380" x2="380" y1="46" y2="444"/>
<g class="actor"><rect x="562" y="10" width="176" height="36" rx="4"/><text x="650" y="33">TSDB</text></g>
<line class="life" x1="650" x2="650" y1="46" y2="444"/>
<g class="note" data-step="1"><rect x="6" y="65" width="219" height="26" rx="3"/><text x="16" y="83">прошло 15 с с прошлого сбора</text></g>
<g class="msg" data-step="2"><line x1="110" y1="120" x2="369" y2="120"/><polygon points="378,120 367,115 367,125"/><text x="245" y="113" text-anchor="middle">GET /metrics · Accept · timeout 10</text></g>
<g class="note" data-step="3"><rect x="281" y="145" width="198" height="26" rx="3"/><text x="291" y="163">generate_latest(registry)</text></g>
<g class="msg data" data-step="4"><line x1="380" y1="200" x2="121" y2="200"/><polygon points="112,200 123,195 123,205"/><text x="245" y="193" text-anchor="middle">200 OK · text/plain · 3 строки</text></g>
<g class="note" data-step="5"><rect x="6" y="225" width="240" height="26" rx="3"/><text x="16" y="243">разбор текста, + job и instance</text></g>
<g class="msg data" data-step="6"><line x1="110" y1="280" x2="639" y2="280"/><polygon points="648,280 637,275 637,285"/><text x="380" y="273" text-anchor="middle">3 отсчёта, время = начало сбора</text></g>
<g class="msg data" data-step="7"><line x1="110" y1="320" x2="639" y2="320"/><polygon points="648,320 637,315 637,325"/><text x="380" y="313" text-anchor="middle">up = 1, scrape_duration_seconds, …</text></g>
<g class="msg" data-step="8"><line x1="110" y1="360" x2="639" y2="360"/><polygon points="648,360 637,355 637,365"/><text x="380" y="353" text-anchor="middle">stale-метки рядам, которых нет в ответе</text></g>
<g class="note" data-step="9"><rect x="8" y="385" width="205" height="26" rx="3"/><text x="18" y="403">ждать следующего интервала</text></g>
</svg>