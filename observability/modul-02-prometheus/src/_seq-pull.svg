<svg class="seq__svg" viewBox="0 0 760 412" role="img" aria-label="Pull: Prometheus сам запрашивает значения у приложения и замечает, что оно недоступно">
<g class="actor"><rect x="92" y="10" width="176" height="36" rx="4"/><text x="180" y="33">Prometheus</text></g>
<line class="life" x1="180" x2="180" y1="46" y2="404"/>
<g class="actor"><rect x="492" y="10" width="176" height="36" rx="4"/><text x="580" y="33">Приложение</text></g>
<line class="life" x1="580" x2="580" y1="46" y2="404"/>
<g class="note" data-step="1"><rect x="67" y="65" width="226" height="26" rx="3"/><text x="77" y="83">в конфигурации: список target</text></g>
<g class="msg" data-step="2"><line x1="180" y1="120" x2="569" y2="120"/><polygon points="578,120 567,115 567,125"/><text x="380" y="113" text-anchor="middle">GET /metrics</text></g>
<g class="msg data" data-step="3"><line x1="580" y1="160" x2="191" y2="160"/><polygon points="182,160 193,155 193,165"/><text x="380" y="153" text-anchor="middle">200 OK · текущие значения</text></g>
<g class="note" data-step="4"><rect x="85" y="185" width="190" height="26" rx="3"/><text x="95" y="203">up = 1, записать отсчёты</text></g>
<g class="msg" data-step="5"><line x1="180" y1="240" x2="569" y2="240"/><polygon points="578,240 567,235 567,245"/><text x="380" y="233" text-anchor="middle">GET /metrics</text></g>
<g class="note" data-step="6"><rect x="481" y="265" width="198" height="26" rx="3"/><text x="491" y="283">процесс упал: порт закрыт</text></g>
<g class="msg data" data-step="7"><line x1="580" y1="320" x2="191" y2="320"/><polygon points="182,320 193,315 193,325"/><text x="380" y="313" text-anchor="middle">connection refused</text></g>
<g class="note" data-step="8"><rect x="81" y="345" width="198" height="26" rx="3"/><text x="91" y="363">up = 0: target недоступен</text></g>
</svg>