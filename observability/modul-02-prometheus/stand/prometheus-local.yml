# Вариант без Docker: Prometheus и приложение запущены прямо на компьютере.
# Приложение: uvicorn app:app --port 8020
# Prometheus: ./prometheus --config.file=prometheus-local.yml
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['localhost:8020']
