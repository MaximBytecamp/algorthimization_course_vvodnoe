global:
  scrape_interval: 5s
scrape_configs:
  # Два процесса одного сервиса: у каждого свои счётчики, поэтому и целей две.
  - job_name: orders-api
    static_configs:
      - targets: ['host.docker.internal:8025']
  - job_name: orders-worker
    static_configs:
      - targets: ['host.docker.internal:8026']
