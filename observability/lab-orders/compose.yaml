# Стенд второй темы: брокер очереди, сбор метрик и панели.
# API и воркер запускаются отдельными процессами Python, в Compose они не входят.
name: makarov-orders-lab
services:
  redis:
    image: redis:7.4.1-alpine
    ports: ['127.0.0.1:6389:6379']
    command: ['redis-server', '--save', '', '--appendonly', 'no']
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ['127.0.0.1:9096:9090']
    volumes: ['./prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    extra_hosts: ['host.docker.internal:host-gateway']
  grafana:
    image: grafana/grafana:12.1.1
    ports: ['127.0.0.1:3016:3000']
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
