# Глава 4.4: каждый предел опроса на своём задании.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: timeout          # exporter склада ждёт склад 2 секунды
    scrape_timeout: 1s
    static_configs:
      - targets: ['sklad-exporter:8000']

  - job_name: body-size        # ответ node_exporter — около 100 КБ
    body_size_limit: 1KB
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: label-count      # у http_requests_total 5 меток вместе с job и instance
    label_limit: 4
    static_configs:
      - targets: ['api:8000']

  - job_name: label-length     # значение route="/orders/{order_id}" — 18 символов
    label_value_length_limit: 10
    static_configs:
      - targets: ['api:8000']

  - job_name: target-count     # две копии сервиса при пределе в одну
    target_limit: 1
    static_configs:
      - targets: ['api:8000', 'api2:8000']
