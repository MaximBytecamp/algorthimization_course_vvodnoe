# Глава 4.7: Prometheus опрашивает Pushgateway, куда отправляют метрики пакетные задачи.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: pushgateway
    honor_labels: true          # оставить job и instance, с которыми задача отправила метрики
    static_configs:
      - targets: ['pushgateway:9091']

  - job_name: pushgateway-bez-honor
    static_configs:
      - targets: ['pushgateway:9091']
