# Модуль 4: три задания — свой сервис, exporter склада и exporter машины.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: orders
    static_configs:
      - targets: ['api:8000']

  - job_name: sklad
    static_configs:
      - targets: ['sklad-exporter:8000']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
