<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 590" role="img"><title>Сравнение последовательной организации разработки и итераций с работающими приращениями</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#087f86"/></marker><filter id="shadow" x="-50%" y="-30%" width="200%" height="200%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#152b38" flood-opacity=".18"/></filter></defs><rect x="0" y="0" width="1080" height="590" rx="22" fill="#f4f1e9" stroke="none" stroke-width="2"/><text x="28" y="37" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#192c39">Когда заказчик впервые проверит работающий сценарий?</text><text x="28" y="86" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#192c39">Последовательная организация</text><rect x="34" y="108" width="220" height="70" rx="8" fill="#d7e6e1" stroke="none" stroke-width="2"/><text x="50" y="149" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#192c39">Требования</text><path d="M256 143 L280 173" fill="none" stroke="#087f86" stroke-width="4" marker-end="url(#a)"/><rect x="286" y="138" width="220" height="70" rx="8" fill="#c2d9d1" stroke="none" stroke-width="2"/><text x="302" y="179" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#192c39">Дизайн</text><path d="M508 173 L532 203" fill="none" stroke="#087f86" stroke-width="4" marker-end="url(#a)"/><rect x="538" y="168" width="220" height="70" rx="8" fill="#a7c8bd" stroke="none" stroke-width="2"/><text x="554" y="209" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#192c39">Разработка</text><path d="M760 203 L784 233" fill="none" stroke="#087f86" stroke-width="4" marker-end="url(#a)"/><rect x="790" y="198" width="220" height="70" rx="8" fill="#80b3a3" stroke="none" stroke-width="2"/><text x="806" y="239" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#192c39">Проверка</text><text x="545" y="281" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#192c39">Проверка общего результата — в конце цепочки</text><path d="M28 309 H1052" fill="none" stroke="#aab9b4" stroke-width="1" /><text x="28" y="351" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#192c39">Итерации с приращением продукта</text><rect x="28" y="376" width="326" height="119" rx="10" fill="white" stroke="#9cb7ac" stroke-width="2"/><text x="43" y="409" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#192c39">Каталог + заказ</text><text x="43" y="438" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#192c39">Можно оформить заказ</text><text x="43" y="472" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#087f86">Показ → обратная связь</text><path d="M355 432 L378 432" fill="none" stroke="#087f86" stroke-width="4" marker-end="url(#a)"/><path d="M320 499 Q320 539 183 539 Q50 539 50 499" fill="none" stroke="#087f86" stroke-width="3" /><rect x="383" y="376" width="326" height="119" rx="10" fill="white" stroke="#9cb7ac" stroke-width="2"/><text x="398" y="409" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#192c39">+ резерв остатков</text><text x="398" y="438" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#192c39">Нельзя продать лишнее</text><text x="398" y="472" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#087f86">Показ → обратная связь</text><path d="M710 432 L733 432" fill="none" stroke="#087f86" stroke-width="4" marker-end="url(#a)"/><path d="M675 499 Q675 539 538 539 Q405 539 405 499" fill="none" stroke="#087f86" stroke-width="3" /><rect x="738" y="376" width="326" height="119" rx="10" fill="white" stroke="#9cb7ac" stroke-width="2"/><text x="753" y="409" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#192c39">+ онлайн-оплата</text><text x="753" y="438" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#192c39">Можно оплатить на сайте</text><text x="753" y="472" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#087f86">Показ → обратная связь</text><path d="M1030 499 Q1030 539 893 539 Q760 539 760 499" fill="none" stroke="#087f86" stroke-width="3" /><text x="28" y="576" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#192c39">Каждый цикл уточняет продукт. Длина и состав циклов здесь не задают Scrum.</text></svg>