<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img"><title>Шесть факторов, которые влияют на решение участника команды</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#087f86"/></marker></defs><rect width="1080" height="520" rx="22" fill="#f4f1e9"/><text x="40" y="48" font-family="Arial" font-size="24" font-weight="700" fill="#192c39">Что влияет на решение участника команды</text><circle cx="540" cy="273" r="102" fill="#fff" stroke="#192c39" stroke-width="3"/><circle cx="540" cy="236" r="34" fill="#edb376" stroke="#192c39" stroke-width="2"/><path d="M482 345q58-94 116 0" fill="#82c5d0" stroke="#192c39" stroke-width="2"/><text x="489" y="389" font-family="Arial" font-size="18" font-weight="700" fill="#192c39">Решение в задаче</text><g font-family="Arial" fill="#192c39"><g><rect x="64" y="91" width="252" height="108" rx="14" fill="#fff" stroke="#192c39" stroke-width="2"/><text x="88" y="126" font-size="19" font-weight="700">Авторитет</text><text x="88" y="155" font-size="15">Мнение руководителя</text><text x="88" y="177" font-size="15">звучит как ожидание.</text><path d="M316 169l117 59" fill="none" stroke="#087f86" stroke-width="4" marker-end="url(#a)"/></g><g><rect x="764" y="91" width="252" height="108" rx="14" fill="#fff" stroke="#192c39" stroke-width="2"/><text x="788" y="126" font-size="19" font-weight="700">Мнение группы</text><text x="788" y="155" font-size="15">Согласие коллег задаёт</text><text x="788" y="177" font-size="15">норму ответа.</text><path d="M764 169L647 228" fill="none" stroke="#087f86" stroke-width="4" marker-end="url(#a)"/></g><g><rect x="49" y="329" width="267" height="108" rx="14" fill="#fff6e5" stroke="#b4531f" stroke-width="2"/><text x="73" y="364" font-size="19" font-weight="700">Срочность</text><text x="73" y="393" font-size="15">Срок сужает поиск</text><text x="73" y="415" font-size="15">других вариантов.</text><path d="M316 352l115-39" fill="none" stroke="#b4531f" stroke-width="4" marker-end="url(#a)"/></g><g><rect x="764" y="329" width="267" height="108" rx="14" fill="#e7f0ed" stroke="#154f33" stroke-width="2"/><text x="788" y="364" font-size="19" font-weight="700">Автономия</text><text x="788" y="393" font-size="15">Можно выбрать способ</text><text x="788" y="415" font-size="15">достичь результата.</text><path d="M764 352l-115-39" fill="none" stroke="#154f33" stroke-width="4" marker-end="url(#a)"/></g><g><rect x="351" y="82" width="378" height="58" rx="12" fill="#d4eedf" stroke="#154f33" stroke-width="2"/><text x="375" y="117" font-size="17" font-weight="700">Компетентность · есть понятный следующий шаг</text><path d="M540 140v28" fill="none" stroke="#154f33" stroke-width="4" marker-end="url(#a)"/></g><g><rect x="351" y="430" width="378" height="58" rx="12" fill="#d6f0f9" stroke="#087f86" stroke-width="2"/><text x="375" y="465" font-size="17" font-weight="700">Принадлежность · можно попросить помощь</text><path d="M540 430v-28" fill="none" stroke="#087f86" stroke-width="4" marker-end="url(#a)"/></g></g><text x="40" y="490" font-family="Arial" font-size="16" fill="#192c39">Руководитель не управляет людьми кнопками: он меняет условия, в которых команда сообщает факт и выбирает действие.</text></svg>