<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img"><title>Сравнение давления и разговора о риске перед выпуском</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#087f86"/></marker></defs><rect width="1080" height="520" rx="22" fill="#f4f1e9"/><text x="40" y="48" font-family="Arial" font-size="24" font-weight="700" fill="#192c39">Один риск — два способа провести разговор</text><rect x="42" y="83" width="470" height="353" rx="17" fill="#fff" stroke="#b4531f" stroke-width="3"/><rect x="42" y="83" width="470" height="59" rx="17" fill="#6e2f12"/><path d="M42 121h470" stroke="#6e2f12" stroke-width="40"/><text x="67" y="120" font-family="Arial" font-size="19" font-weight="700" fill="#fff">Давление: получить согласие</text><rect x="76" y="166" width="400" height="64" rx="11" fill="#f7e2d4"/><text x="95" y="195" font-family="Arial" font-size="17" font-weight="700" fill="#6e2f12">«Не усложняй. Просто поставь “готово”»</text><path d="M275 236v44" stroke="#b4531f" stroke-width="5" marker-end="url(#a)"/><rect x="106" y="289" width="337" height="52" rx="9" fill="#fff6e5"/><text x="130" y="321" font-family="Arial" font-size="16" fill="#192c39">В чате: «готово»</text><path d="M275 341v37" stroke="#b4531f" stroke-width="5" marker-end="url(#a)"/><rect x="92" y="382" width="366" height="34" rx="8" fill="#f3cbc1"/><text x="115" y="405" font-family="Arial" font-size="15" font-weight="700" fill="#6e2f12">Позже: дефект обнаруживает покупатель</text><rect x="568" y="83" width="470" height="353" rx="17" fill="#fff" stroke="#154f33" stroke-width="3"/><rect x="568" y="83" width="470" height="59" rx="17" fill="#154f33"/><path d="M568 121h470" stroke="#154f33" stroke-width="40"/><text x="593" y="120" font-family="Arial" font-size="19" font-weight="700" fill="#fff">Управление: получить данные</text><rect x="602" y="166" width="400" height="64" rx="11" fill="#d4eedf"/><text x="622" y="191" font-family="Arial" font-size="16" font-weight="700" fill="#154f33">«Покажи проверенное, риск</text><text x="622" y="213" font-family="Arial" font-size="16" font-weight="700" fill="#154f33">и два варианта релиза»</text><path d="M803 236v44" stroke="#087f86" stroke-width="5" marker-end="url(#a)"/><rect x="632" y="289" width="337" height="52" rx="9" fill="#e7f0ed"/><text x="654" y="321" font-family="Arial" font-size="16" fill="#192c39">Задача: риск + варианты</text><path d="M803 341v37" stroke="#087f86" stroke-width="5" marker-end="url(#a)"/><rect x="618" y="382" width="366" height="34" rx="8" fill="#cde5d5"/><text x="644" y="405" font-family="Arial" font-size="15" font-weight="700" fill="#154f33">Сейчас: ограниченный, проверяемый выпуск</text><text x="42" y="483" font-family="Arial" font-size="16" fill="#192c39">Требование к результату остаётся. Меняется предмет разговора: личность и послушание либо факт, последствия и решение.</text></svg>