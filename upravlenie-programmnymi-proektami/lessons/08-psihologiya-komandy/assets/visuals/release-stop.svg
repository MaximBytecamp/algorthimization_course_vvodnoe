<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img"><title>Команда останавливает выпуск и выбирает ограниченную демонстрацию</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#087f86"/></marker></defs><rect width="1080" height="520" rx="22" fill="#f4f1e9"/><text x="40" y="48" font-family="Arial" font-size="24" font-weight="700" fill="#192c39">Остановить опасный выпуск — значит сделать проблему видимой</text><path d="M90 282h598" fill="none" stroke="#87a39a" stroke-width="18" stroke-linecap="round"/><path d="M90 282h210" stroke="#087f86" stroke-width="18" stroke-linecap="round"/><path d="M382 282h306" stroke="#b4531f" stroke-width="18" stroke-linecap="round" stroke-dasharray="12 10"/><g font-family="Arial"><g><circle cx="114" cy="180" r="28" fill="#edb376" stroke="#192c39" stroke-width="2"/><path d="M71 254q43-69 86 0" fill="#82c5d0" stroke="#192c39" stroke-width="2"/><text x="58" y="331" font-size="16" font-weight="700" fill="#192c39">Разработчик</text></g><g><circle cx="282" cy="180" r="28" fill="#edb376" stroke="#192c39" stroke-width="2"/><path d="M239 254q43-69 86 0" fill="#d6f0f9" stroke="#192c39" stroke-width="2"/><text x="250" y="331" font-size="16" font-weight="700" fill="#192c39">QA</text></g><g><circle cx="470" cy="180" r="28" fill="#edb376" stroke="#192c39" stroke-width="2"/><path d="M427 254q43-69 86 0" fill="#d4eedf" stroke="#192c39" stroke-width="2"/><text x="433" y="331" font-size="16" font-weight="700" fill="#192c39">Проект</text></g></g><path d="M331 133v80" stroke="#b4531f" stroke-width="7"/><circle cx="331" cy="117" r="45" fill="#f7e2d4" stroke="#b4531f" stroke-width="4"/><rect x="310" y="102" width="42" height="29" rx="3" fill="#b4531f"/><path d="M331 111v11" stroke="#fff" stroke-width="5"/><text x="270" y="75" font-family="Arial" font-size="17" font-weight="700" fill="#6e2f12">СТОП: резерв не проверен</text><rect x="728" y="99" width="301" height="315" rx="18" fill="#fff" stroke="#192c39" stroke-width="2"/><text x="755" y="139" font-family="Arial" font-size="19" font-weight="700" fill="#192c39">Решение на демонстрацию</text><rect x="755" y="166" width="246" height="68" rx="9" fill="#d4eedf"/><text x="776" y="194" font-family="Arial" font-size="17" font-weight="700" fill="#154f33">Показываем</text><text x="776" y="216" font-family="Arial" font-size="15" fill="#154f33">каталог и тестовый заказ</text><rect x="755" y="249" width="246" height="68" rx="9" fill="#f7e2d4"/><text x="776" y="277" font-family="Arial" font-size="17" font-weight="700" fill="#6e2f12">Не обещаем</text><text x="776" y="299" font-family="Arial" font-size="15" fill="#6e2f12">резервирование товара</text><path d="M858 320v39" stroke="#087f86" stroke-width="5" marker-end="url(#a)"/><rect x="755" y="367" width="246" height="28" rx="6" fill="#d6f0f9"/><text x="777" y="387" font-family="Arial" font-size="14" font-weight="700" fill="#192c39">Задача: проверка до 12:00</text><text x="42" y="474" font-family="Arial" font-size="16" fill="#192c39">Остановка не завершает работу. Она переводит риск в видимое решение с ограничением, владельцем и следующей проверкой.</text></svg>