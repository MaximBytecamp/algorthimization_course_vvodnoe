<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img"><title>Команда скрывает риск резервирования товара из-за давления срока</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#087f86"/></marker><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#152b38" flood-opacity=".16"/></filter></defs><rect width="1080" height="520" rx="22" fill="#f4f1e9"/><text x="40" y="48" font-family="Arial" font-size="24" font-weight="700" fill="#192c39">Риск известен, но не попал в решение</text><rect x="42" y="83" width="642" height="354" rx="18" fill="#fff" stroke="#192c39" stroke-width="2" filter="url(#s)"/><rect x="42" y="83" width="642" height="50" rx="18" fill="#193d35"/><path d="M42 115H684" stroke="#193d35" stroke-width="36"/><text x="67" y="115" font-family="Arial" font-size="17" font-weight="700" fill="#fff">Чат запуска · «СЕВЕР»</text><circle cx="83" cy="177" r="22" fill="#edb376"/><path d="M72 174q11-18 22 0v15H72z" fill="#192c39"/><rect x="121" y="151" width="424" height="75" rx="12" fill="#e7f0ed"/><text x="141" y="180" font-family="Arial" font-size="17" font-weight="700" fill="#192c39">Руководитель проекта</text><text x="141" y="207" font-family="Arial" font-size="16" fill="#192c39">«Переносить нельзя. В понедельник всё готово?»</text><circle cx="83" cy="280" r="22" fill="#82c5d0"/><path d="M72 277q11-18 22 0v15H72z" fill="#192c39"/><rect x="121" y="254" width="380" height="75" rx="12" fill="#e8eef0"/><text x="141" y="283" font-family="Arial" font-size="17" font-weight="700" fill="#192c39">Разработчик</text><text x="141" y="310" font-family="Arial" font-size="16" fill="#192c39">«Почти готово…»</text><path d="M512 289h112" stroke="#a0adb0" stroke-width="4" stroke-dasharray="8 8"/><text x="530" y="279" font-family="Arial" font-size="14" fill="#6d777a">не сказал</text><rect x="518" y="302" width="130" height="68" rx="9" fill="#f7e2d4" stroke="#b4531f" stroke-width="2"/><text x="534" y="329" font-family="Arial" font-size="14" font-weight="700" fill="#6e2f12">Ошибка резерва</text><text x="534" y="350" font-family="Arial" font-size="13" fill="#6e2f12">2 покупателя → 1 товар</text><path d="M583 302l-24-22M607 302l24-22" stroke="#b4531f" stroke-width="4"/><rect x="724" y="102" width="307" height="325" rx="18" fill="#fff" stroke="#192c39" stroke-width="2" filter="url(#s)"/><text x="751" y="142" font-family="Arial" font-size="18" font-weight="700" fill="#192c39">Понедельник · демонстрация</text><rect x="755" y="170" width="245" height="72" rx="8" fill="#d4eedf"/><text x="778" y="202" font-family="Arial" font-size="18" font-weight="700" fill="#154f33">Статус: «готово»</text><text x="778" y="225" font-family="Arial" font-size="14" fill="#154f33">Проблема в задаче не записана</text><path d="M878 244v65" stroke="#087f86" stroke-width="5" marker-end="url(#a)"/><rect x="755" y="321" width="245" height="70" rx="8" fill="#f7e2d4" stroke="#b4531f" stroke-width="2"/><text x="778" y="351" font-family="Arial" font-size="17" font-weight="700" fill="#6e2f12">Двойная продажа</text><text x="778" y="374" font-family="Arial" font-size="14" fill="#6e2f12">Риск обнаружен покупателем</text><path d="M684 290h31" stroke="#b4531f" stroke-width="5" marker-end="url(#a)"/><text x="42" y="484" font-family="Arial" font-size="17" font-weight="700" fill="#192c39">Давление меняет сообщение команды: риск остаётся в личной переписке вместо рабочей записи.</text></svg>