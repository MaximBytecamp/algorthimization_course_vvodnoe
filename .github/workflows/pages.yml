name: Publish OP.04

on:
  push:
    branches: [main]
    paths:
      - 'op04-algoritmizaciya/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare discipline pages
        run: |
          mkdir -p _site
          mkdir -p _site/op04-algoritmizaciya
          rsync -a --include='*/' --include='*.html' --include='*.css' --include='*.js' --include='*.png' --include='*.jpg' --include='*.jpeg' --include='*.svg' --include='*.webp' --include='*.gif' --include='*.woff*' --include='*.pdf' --exclude='*' op04-algoritmizaciya/ _site/op04-algoritmizaciya/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=op04-algoritmizaciya/index.html"><a href="op04-algoritmizaciya/index.html">ОП.04</a>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
