# PostgreSQL для занятий МДК.01.11.
# Порт на компьютере — 5433, чтобы не мешать PostgreSQL, если он уже установлен.
services:
  db:
    image: postgres:17
    container_name: orders-db
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
    ports:
      - "5433:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
